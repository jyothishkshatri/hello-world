<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CertOps 47</title><style>:root{--bg:#f5f7fb;--s:#fff;--ink:#152033;--mut:#6b7890;--line:#e2e7ef;--nav:#111a2c;--acc:#0e8f82;--red:#c93f4c;--amber:#b87514;--green:#25865d}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--nav);color:#dce5f2;padding:22px 14px}.brand{font-weight:800;font-size:18px;padding:0 10px 24px}.brand span{color:#31baa9}.nav button{width:100%;border:0;background:transparent;color:#9cabbe;text-align:left;padding:11px 12px;border-radius:8px;margin:2px 0}.nav button.on{background:#183833;color:#fff}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:3}.top strong{font-size:18px}.content{padding:24px 26px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.card{padding:16px}.card b{display:block;font-size:27px;margin-top:9px}.mut{color:var(--mut);font-size:12px}.panel{overflow:hidden;margin-top:14px}.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.ph h3{margin:0;font-size:14px}table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #edf0f4;font-size:12px}th{color:var(--mut);font-size:11px;background:#fafbfd}.badge{padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700}.ok{background:#e9f7f0;color:var(--green)}.warn{background:#fff4de;color:var(--amber)}.crit{background:#fff0f2;color:var(--red)}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(500px,100%);background:#fff;box-shadow:-20px 0 50px #11203322;z-index:10;padding:24px;overflow:auto}.drawer h2{margin-top:0}.field{margin:14px 0}.field label{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none}.empty{padding:35px;text-align:center;color:var(--mut)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr 1fr}.content,.top{padding-left:16px;padding-right:16px}}@media(max-width:560px){.cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}th:nth-child(3),td:nth-child(3){display:none}}</style></head><body><div class="app"><aside class="side"><div class="brand">CertOps <span>47</span></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><strong id="title">Operations Overview</strong><div class="row"><button class="btn" onclick="resetDemo()">Reset demo</button><button class="btn p" onclick="openCert()">+ Certificate</button></div></header><section class="content" id="view"></section></main></div><div id="drawer"></div><script>const seed={certs:[{id:1,name:'claims-api.prod.example.com',app:'Claims API',env:'PROD',owner:'Claims PKI Owners',expires:'2026-08-29',status:'Critical',renew:'Auto'},{id:2,name:'payments.example.com',app:'Payments',env:'PROD',owner:'Payments Certificate Owners',expires:'2026-09-18',status:'Warning',renew:'Auto'},{id:3,name:'member-portal.example.com',app:'Member Portal',env:'PREPROD',owner:'Digital Platform PKI',expires:'2026-10-02',status:'Healthy',renew:'Manual'},{id:4,name:'internal-mq.service.local',app:'Messaging',env:'SIT',owner:'Platform PKI',expires:'2026-11-06',status:'Healthy',renew:'Auto'}],cases:[{id:101,event:'deployment.failed',cert:1,env:'PROD',severity:'Critical',state:'Open',owner:'Production SRE',why:'Post-deployment health check failed'},{id:102,event:'renewal.action_required',cert:2,env:'PROD',severity:'High',state:'Acknowledged',owner:'Payments Certificate Owners',why:'Domain validation action required'},{id:103,event:'certificate.expiry_risk',cert:3,env:'PREPROD',severity:'Medium',state:'Open',owner:'Digital Platform PKI',why:'Manual renewal has not started'}],groups:[{id:1,name:'Claims PKI Owners',email:'claims-pki@example.com',members:6,roles:'Certificate owner'},{id:2,name:'Production SRE',email:'prod-sre@example.com',members:9,roles:'Environment operator'},{id:3,name:'Enterprise PKI On-Call',email:'pki-oncall@example.com',members:4,roles:'Tenant fallback'},{id:4,name:'Production CAB',email:'prod-cab@example.com',members:5,roles:'Deployment approver'}],policies:[{id:1,name:'Production deployment failure',event:'deployment.failed',scope:'PROD',channels:'Email, Teams, Pager',ack:'Yes',escalation:'15m → Business Owner; 30m → Tenant Admin'},{id:2,name:'Renewal action required',event:'renewal.action_required',scope:'All',channels:'Email, In-app',ack:'Yes',escalation:'24h → PKI On-Call'},{id:3,name:'Routine success digest',event:'*.succeeded',scope:'All',channels:'Daily digest',ack:'No',escalation:'None'}]};let db=JSON.parse(localStorage.certops47||'null')||structuredClone(seed),page='overview';const pages=[['overview','Operations Overview'],['certs','Certificates'],['cases','Notification Cases'],['policies','Policies'],['directory','Directory & Ownership'],['sim','Recipient Simulator']];function save(){localStorage.certops47=JSON.stringify(db)}function nav(){navEl=document.getElementById('nav');navEl.innerHTML=pages.map(x=>`<button class="${page==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function go(p){page=p;document.getElementById('title').textContent=pages.find(x=>x[0]==p)[1];render()}function b(s){return `<span class="badge ${s=='Healthy'||s=='Resolved'?'ok':s=='Critical'||s=='Open'?'crit':'warn'}">${s}</span>`}function render(){nav();let v=document.getElementById('view');if(page=='overview'){let crit=db.certs.filter(x=>x.status=='Critical').length,open=db.cases.filter(x=>x.state=='Open').length;v.innerHTML=`<div class="row between"><div><h2>Certificate operations at a glance</h2><div class="mut">Ownership, renewal risk, deployments and user notifications in one workspace.</div></div><button class="btn p" onclick="go('sim')">Simulate event</button></div><div class="cards"><div class="card"><span class="mut">Managed certificates</span><b>${db.certs.length}</b></div><div class="card"><span class="mut">Critical risk</span><b>${crit}</b></div><div class="card"><span class="mut">Open cases</span><b>${open}</b></div><div class="card"><span class="mut">Owner groups</span><b>${db.groups.length}</b></div></div>${certTable(db.certs.slice(0,4),'Certificate runway')}${caseTable(db.cases.slice(0,3),'Action center')}`}
else if(page=='certs')v.innerHTML=`<div class="row between"><div><h2>Certificate inventory</h2><div class="mut">Emails are resolved through owner groups, not stored on each certificate.</div></div><button class="btn p" onclick="openCert()">+ Add certificate</button></div>${certTable(db.certs,'All certificates')}`;
else if(page=='cases')v.innerHTML=`<div><h2>Notification cases</h2><div class="mut">Repeated events become one actionable case with acknowledgement and resolution state.</div></div>${caseTable(db.cases,'Cases')}`;
else if(page=='policies')v.innerHTML=`<div class="row between"><div><h2>Notification policies</h2><div class="mut">Route events by scope, responsibility role, channel and escalation.</div></div><button class="btn p" onclick="openPolicy()">+ Policy</button></div><div class="panel"><table><thead><tr><th>Name</th><th>Event</th><th>Scope</th><th>Channels</th><th>Ack</th><th></th></tr></thead><tbody>${db.policies.map(x=>`<tr><td><b>${x.name}</b><div class="mut">${x.escalation}</div></td><td>${x.event}</td><td>${x.scope}</td><td>${x.channels}</td><td>${x.ack}</td><td><button class="btn" onclick="openPolicy(${x.id})">Edit</button></td></tr>`).join('')}</tbody></table></div>`;
else if(page=='directory')v.innerHTML=`<div class="row between"><div><h2>Directory & ownership</h2><div class="mut">Groups are centrally managed and reused across certificates, apps and environments.</div></div><button class="btn p" onclick="openGroup()">+ Group</button></div><div class="panel"><table><thead><tr><th>Group</th><th>Delivery alias</th><th>Members</th><th>Role</th><th></th></tr></thead><tbody>${db.groups.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.email}</td><td>${x.members}</td><td>${x.roles}</td><td><button class="btn" onclick="openGroup(${x.id})">Edit</button></td></tr>`).join('')}</tbody></table></div>`;
else v.innerHTML=simulator()}
function certTable(rows,title){return `<div class="panel"><div class="ph"><h3>${title}</h3><span class="mut">${rows.length} records</span></div><table><thead><tr><th>Certificate</th><th>Application</th><th>Environment</th><th>Owner</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${x.name}</b><div class="mut">Renewal: ${x.renew}</div></td><td>${x.app}</td><td>${x.env}</td><td>${x.owner}</td><td>${x.expires}</td><td>${b(x.status)}</td><td><button class="btn" onclick="openCert(${x.id})">Edit</button></td></tr>`).join('')}</tbody></table></div>`}function caseTable(rows,title){return `<div class="panel"><div class="ph"><h3>${title}</h3><span class="mut">${rows.length} cases</span></div><table><thead><tr><th>Event</th><th>Certificate</th><th>Environment</th><th>Assigned group</th><th>State</th><th></th></tr></thead><tbody>${rows.map(x=>{let c=db.certs.find(y=>y.id==x.cert);return `<tr><td><b>${x.event}</b><div class="mut">${x.why}</div></td><td>${c?.name||'—'}</td><td>${x.env}</td><td>${x.owner}</td><td>${b(x.state)}</td><td>${x.state!='Resolved'?`<button class="btn" onclick="resolveCase(${x.id})">Resolve</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`}function drawer(html){document.getElementById('drawer').innerHTML=`<div class="drawer">${html}</div>`}function closeD(){document.getElementById('drawer').innerHTML=''}function openCert(id){let x=db.certs.find(y=>y.id==id)||{id:Date.now(),name:'',app:'',env:'DEV',owner:db.groups[0]?.name||'',expires:'2026-12-01',status:'Healthy',renew:'Auto'};drawer(`<div class="row between"><h2>${id?'Edit':'Add'} certificate</h2><button class="btn" onclick="closeD()">Close</button></div><form onsubmit="saveCert(event,${x.id},${!!id})"><div class="field"><label>Certificate / common name</label><input name="name" required value="${x.name}"></div><div class="grid2"><div class="field"><label>Application</label><input name="app" value="${x.app}"></div><div class="field"><label>Environment</label><select name="env">${['DEV','SIT','PREPROD','PROD'].map(v=>`<option ${v==x.env?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Owner group</label><select name="owner">${db.groups.map(g=>`<option ${g.name==x.owner?'selected':''}>${g.name}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Expiry</label><input type="date" name="expires" value="${x.expires}"></div><div class="field"><label>Status</label><select name="status">${['Healthy','Warning','Critical'].map(v=>`<option ${v==x.status?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Renewal mode</label><select name="renew"><option ${x.renew=='Auto'?'selected':''}>Auto</option><option ${x.renew=='Manual'?'selected':''}>Manual</option></select></div><div class="row"><button class="btn p">Save</button>${id?`<button type="button" class="btn d" onclick="deleteCert(${x.id})">Delete</button>`:''}</div></form>`)}function saveCert(e,id,exists){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id;if(exists)db.certs=db.certs.map(x=>x.id==id?o:x);else db.certs.unshift(o);save();closeD();render()}function deleteCert(id){db.certs=db.certs.filter(x=>x.id!=id);db.cases=db.cases.filter(x=>x.cert!=id);save();closeD();render()}function resolveCase(id){let x=db.cases.find(y=>y.id==id);x.state='Resolved';save();render()}function openPolicy(id){let x=db.policies.find(y=>y.id==id)||{id:Date.now(),name:'',event:'deployment.failed',scope:'All',channels:'Email, In-app',ack:'Yes',escalation:'15m → PKI On-Call'};drawer(`<div class="row between"><h2>${id?'Edit':'Add'} policy</h2><button class="btn" onclick="closeD()">Close</button></div><form onsubmit="savePolicy(event,${x.id},${!!id})">${[['name','Policy name',x.name],['event','Event pattern',x.event],['scope','Scope',x.scope],['channels','Channels',x.channels],['escalation','Escalation',x.escalation]].map(f=>`<div class="field"><label>${f[1]}</label><input name="${f[0]}" value="${f[2]}"></div>`).join('')}<div class="field"><label>Acknowledgement required</label><select name="ack"><option ${x.ack=='Yes'?'selected':''}>Yes</option><option ${x.ack=='No'?'selected':''}>No</option></select></div><button class="btn p">Save policy</button></form>`)}function savePolicy(e,id,exists){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id;if(exists)db.policies=db.policies.map(x=>x.id==id?o:x);else db.policies.unshift(o);save();closeD();render()}function openGroup(id){let x=db.groups.find(y=>y.id==id)||{id:Date.now(),name:'',email:'',members:1,roles:'Certificate owner'};drawer(`<div class="row between"><h2>${id?'Edit':'Add'} group</h2><button class="btn" onclick="closeD()">Close</button></div><form onsubmit="saveGroup(event,${x.id},${!!id})"><div class="field"><label>Group name</label><input name="name" value="${x.name}" required></div><div class="field"><label>Email / distribution alias</label><input name="email" type="email" value="${x.email}" required></div><div class="field"><label>Members</label><input name="members" type="number" value="${x.members}"></div><div class="field"><label>Responsibility role</label><input name="roles" value="${x.roles}"></div><button class="btn p">Save group</button></form>`)}function saveGroup(e,id,exists){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id;if(exists)db.groups=db.groups.map(x=>x.id==id?o:x);else db.groups.unshift(o);save();closeD();render()}function simulator(){let cert=db.certs[0];return `<div><h2>Recipient simulator</h2><div class="mut">Preview exactly who would receive an event and why, without sending anything.</div></div><div class="panel" style="padding:18px"><div class="grid2"><div class="field"><label>Event</label><select id="se"><option>deployment.failed</option><option>renewal.action_required</option><option>certificate.expiry_risk</option><option>certificate.revoked</option></select></div><div class="field"><label>Certificate</label><select id="sc">${db.certs.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></div></div><button class="btn p" onclick="runSim()">Resolve recipients</button><div id="simout"></div></div>`}function runSim(){let c=db.certs.find(x=>x.id==document.getElementById('sc').value),event=document.getElementById('se').value;let names=[c.owner];if(c.env=='PROD')names.push('Production SRE');if(event=='certificate.revoked')names.push('Enterprise PKI On-Call');let groups=[...new Set(names)].map(n=>db.groups.find(g=>g.name==n)).filter(Boolean);document.getElementById('simout').innerHTML=`<div class="panel" style="margin-top:18px"><div class="ph"><h3>Resolved audience</h3><span class="mut">${groups.reduce((a,g)=>a+Number(g.members),0)} users</span></div><table><thead><tr><th>Group</th><th>Alias</th><th>Members</th><th>Why</th></tr></thead><tbody>${groups.map(g=>`<tr><td><b>${g.name}</b></td><td>${g.email}</td><td>${g.members}</td><td>${g.name==c.owner?'Certificate owner':'Environment / fallback role'}</td></tr>`).join('')}</tbody></table></div>`}function resetDemo(){db=structuredClone(seed);save();render()}render();nav();</script></body></html>
