<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a2c">
<title>CertOps 47</title>
<style>
:root{--bg:#f5f7fb;--s:#fff;--ink:#152033;--mut:#6b7890;--line:#e2e7ef;--nav:#111a2c;--acc:#0e8f82;--red:#c93f4c;--amber:#b87514;--green:#25865d;--sidebar:248px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}body{overflow-x:hidden}button,input,select,textarea{font:inherit}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:linear-gradient(180deg,var(--nav),#0d1525);color:#dce5f2;padding:18px 12px;z-index:60;overflow-y:auto;overscroll-behavior:contain}.brand{font-size:18px;font-weight:850;padding:7px 10px 20px;color:#fff}.brand span{color:#31baa9}.workspace{font-size:10px;color:#8291aa;border:1px solid #ffffff16;background:#ffffff09;border-radius:9px;padding:10px;margin:0 6px 14px}.navgroup{margin:14px 0}.navlabel{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:#64748d;padding:0 10px 6px}.nav button{width:100%;border:0;background:transparent;color:#a8b4c6;text-align:left;padding:10px 11px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.on{background:#183833;color:#fff}.main{margin-left:var(--sidebar);min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30;gap:12px}.top-left{display:flex;align-items:center;gap:10px;min-width:0}.top strong{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.menu{display:none;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:20px;line-height:1}.top-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}.content{padding:22px 24px 88px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:var(--red)}h2{margin:0 0 6px;font-size:22px}.mut{color:var(--mut);font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.card{padding:16px}.card b{display:block;font-size:27px;margin-top:8px}.panel{overflow:hidden;margin-top:14px}.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}.ph h3{margin:0;font-size:14px}.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #edf0f4;font-size:12px;vertical-align:top}th{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.04em;background:#fafbfd}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:750}.ok{background:#e9f7f0;color:var(--green)}.warn{background:#fff4de;color:var(--amber)}.crit{background:#fff0f2;color:var(--red)}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(500px,100%);background:#fff;box-shadow:-20px 0 50px #11203322;z-index:100;padding:22px;overflow:auto}.drawer h2{margin-top:0}.field{margin:13px 0}.field label{display:block;font-size:10px;color:var(--mut);font-weight:750;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:10px;margin-top:14px}.listitem{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.listitem h4{margin:0 0 5px}.overlay{display:none}.bottom{display:none}.empty{padding:35px;text-align:center;color:var(--mut)}
@media(max-width:1080px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){:root{--sidebar:0px}.side{width:min(86vw,320px);transform:translateX(-105%);transition:transform .2s ease;box-shadow:18px 0 42px rgba(9,16,29,.24)}body.menu-open .side{transform:translateX(0)}.overlay{display:block;position:fixed;inset:0;background:#09101d66;z-index:50;opacity:0;pointer-events:none;transition:.2s}body.menu-open .overlay{opacity:1;pointer-events:auto}.main{margin-left:0}.menu{display:grid;place-items:center}.top{padding:0 12px;height:62px}.top strong{max-width:44vw}.content{padding:18px 12px 92px}.bottom{display:flex;position:fixed;z-index:45;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:60px;background:#fffffff3;backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 35px #111a2c22;align-items:center;justify-content:space-around}.bottom button{border:0;background:transparent;color:#758198;display:grid;justify-items:center;gap:2px;font-size:9px;padding:7px 8px}.bottom button.on{color:var(--acc);font-weight:750}.bottom .ico{font-size:17px}.top-actions .secondary{display:none}}
@media(max-width:560px){.cards,.grid2{grid-template-columns:1fr}.listitem{display:block}.listitem .btn{margin-top:10px}.ph{align-items:flex-start}.top-actions .btn.p{padding:9px 10px}.top-actions .btn.p span{display:none}h2{font-size:20px}}
</style>
</head>
<body>
<div class="app"><aside class="side" id="side"><div class="brand">CertOps <span>47</span></div><div class="workspace">TENANT · TennCare Enterprise PKI</div><div class="nav" id="nav"></div></aside><div class="overlay" onclick="closeMenu()"></div><main class="main"><header class="top"><div class="top-left"><button class="menu" onclick="toggleMenu()" aria-label="Open navigation">☰</button><strong id="title">Operations Overview</strong></div><div class="top-actions"><button class="btn secondary" onclick="resetDemo()">Reset demo</button><button class="btn p" onclick="openCert()">＋ <span>Certificate</span></button></div></header><section class="content" id="view"></section></main><nav class="bottom" id="bottom"></nav></div><div id="drawer"></div>
<script>
const seed={certs:[{id:1,name:'claims-api.prod.example.com',app:'Claims API',env:'PROD',owner:'Claims PKI Owners',expires:'2026-08-29',status:'Critical',renew:'Auto'},{id:2,name:'payments.example.com',app:'Payments',env:'PROD',owner:'Payments Certificate Owners',expires:'2026-09-18',status:'Warning',renew:'Auto'},{id:3,name:'member-portal.example.com',app:'Member Portal',env:'PREPROD',owner:'Digital Platform PKI',expires:'2026-10-02',status:'Healthy',renew:'Manual'},{id:4,name:'internal-mq.service.local',app:'Messaging',env:'SIT',owner:'Platform PKI',expires:'2026-11-06',status:'Healthy',renew:'Auto'}],apps:[{id:1,name:'Claims API',owner:'Claims Application Owners',certs:8,tier:'Tier 1'},{id:2,name:'Payments',owner:'Payments Application Owners',certs:6,tier:'Tier 1'},{id:3,name:'Member Portal',owner:'Digital Platform',certs:12,tier:'Tier 2'}],envs:[{id:1,name:'DEV',operators:'Development Platform',approvers:'None',window:'Anytime'},{id:2,name:'SIT',operators:'SIT Platform',approvers:'SIT Release',window:'Weekdays 18:00–22:00'},{id:3,name:'PREPROD',operators:'Preprod SRE',approvers:'Preprod CAB',window:'Thu 20:00–23:00'},{id:4,name:'PROD',operators:'Production SRE',approvers:'Production CAB',window:'Sat 22:00–01:00 CT'}],cases:[{id:101,event:'deployment.failed',cert:1,env:'PROD',severity:'Critical',state:'Open',owner:'Production SRE',why:'Post-deployment health check failed'},{id:102,event:'renewal.action_required',cert:2,env:'PROD',severity:'High',state:'Acknowledged',owner:'Payments Certificate Owners',why:'Domain validation action required'},{id:103,event:'certificate.expiry_risk',cert:3,env:'PREPROD',severity:'Medium',state:'Open',owner:'Digital Platform PKI',why:'Manual renewal has not started'}],groups:[{id:1,name:'Claims PKI Owners',email:'claims-pki@example.com',members:6,roles:'Certificate owner'},{id:2,name:'Payments Certificate Owners',email:'payments-pki@example.com',members:5,roles:'Certificate owner'},{id:3,name:'Production SRE',email:'prod-sre@example.com',members:9,roles:'Environment operator'},{id:4,name:'Enterprise PKI On-Call',email:'pki-oncall@example.com',members:4,roles:'Tenant fallback'},{id:5,name:'Production CAB',email:'prod-cab@example.com',members:5,roles:'Deployment approver'}],policies:[{id:1,name:'Production deployment failure',event:'deployment.failed',scope:'PROD',channels:'Email, Teams, Pager',ack:'Yes',escalation:'15m → Business Owner; 30m → Tenant Admin'},{id:2,name:'Renewal action required',event:'renewal.action_required',scope:'All',channels:'Email, In-app',ack:'Yes',escalation:'24h → PKI On-Call'},{id:3,name:'Routine success digest',event:'*.succeeded',scope:'All',channels:'Daily digest',ack:'No',escalation:'None'}],audit:[{when:'Today 18:21',actor:'Marcus Lee',action:'Acknowledged deployment failure',object:'claims-api.prod.example.com'},{when:'Today 17:44',actor:'Aisha Raman',action:'Updated notification policy',object:'Production deployment failure'},{when:'Today 16:12',actor:'System',action:'Renewal completed',object:'payments.example.com'}]};
let db=JSON.parse(localStorage.certops47mobile||'null')||structuredClone(seed),page='overview';
const pages=[['overview','Operations Overview','◫','Core'],['certs','Certificates','◇','Core'],['apps','Applications','▦','Inventory'],['envs','Environments','◉','Inventory'],['cases','Notification Cases','●','Notifications'],['policies','Policies','◆','Notifications'],['sim','Recipient Simulator','⚡','Notifications'],['directory','Directory & Ownership','◎','Administration'],['audit','Audit Trail','≡','Administration'],['settings','Settings','⚙','Administration']];
function save(){localStorage.certops47mobile=JSON.stringify(db)}function toggleMenu(){document.body.classList.toggle('menu-open')}function closeMenu(){document.body.classList.remove('menu-open')}function go(p){page=p;closeMenu();document.getElementById('title').textContent=pages.find(x=>x[0]==p)[1];render();scrollTo(0,0)}
function renderNav(){let groups={};pages.forEach(x=>(groups[x[3]]??=[]).push(x));nav.innerHTML=Object.entries(groups).map(([g,items])=>`<div class="navgroup"><div class="navlabel">${g}</div>${items.map(x=>`<button class="${page==x[0]?'on':''}" onclick="go('${x[0]}')">${x[2]} &nbsp; ${x[1]}</button>`).join('')}</div>`).join('');let primary=[['overview','⌂','Home'],['certs','◇','Certs'],['cases','●','Cases'],['policies','◆','Policies']];bottom.innerHTML=primary.map(x=>`<button class="${page==x[0]?'on':''}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')+`<button class="${!primary.some(x=>x[0]==page)?'on':''}" onclick="toggleMenu()"><span class="ico">☰</span>More</button>`}
function b(s){return `<span class="badge ${s=='Healthy'||s=='Resolved'?'ok':s=='Critical'||s=='Open'?'crit':'warn'}">${s}</span>`}function table(headers,rows,title){return `<div class="panel"><div class="ph"><h3>${title}</h3><span class="mut">Swipe table horizontally on mobile</span></div><div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`}
function render(){renderNav();let v=view;if(page=='overview'){let crit=db.certs.filter(x=>x.status=='Critical').length,open=db.cases.filter(x=>x.state=='Open').length;v.innerHTML=`<div class="row between"><div><h2>Certificate operations at a glance</h2><div class="mut">Ownership, renewal risk, deployments and user notifications in one workspace.</div></div><button class="btn p" onclick="go('sim')">Simulate event</button></div><div class="cards"><div class="card"><span class="mut">Managed certificates</span><b>${db.certs.length}</b></div><div class="card"><span class="mut">Critical risk</span><b>${crit}</b></div><div class="card"><span class="mut">Open cases</span><b>${open}</b></div><div class="card"><span class="mut">Owner groups</span><b>${db.groups.length}</b></div></div>${certTable(db.certs,'Certificate runway')}${caseTable(db.cases,'Action center')}`}
else if(page=='certs')v.innerHTML=`<div class="row between"><div><h2>Certificate inventory</h2><div class="mut">Emails are resolved through owner groups, not stored on each certificate.</div></div><button class="btn p" onclick="openCert()">+ Add certificate</button></div>${certTable(db.certs,'All certificates')}`;
else if(page=='apps')v.innerHTML=`<h2>Applications</h2><div class="mut">Ownership inherited by certificates attached to each application.</div>${table(['Application','Tier','Application owner','Certificates',''],db.apps.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.tier}</td><td>${x.owner}</td><td>${x.certs}</td><td><button class="btn" onclick="editSimple('app',${x.id})">Edit</button></td></tr>`),'Application ownership')}`;
else if(page=='envs')v.innerHTML=`<h2>Environments</h2><div class="mut">Environment operators, deployment approvers and maintenance windows.</div>${table(['Environment','Operators','Approvers','Change window',''],db.envs.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.operators}</td><td>${x.approvers}</td><td>${x.window}</td><td><button class="btn" onclick="editSimple('env',${x.id})">Edit</button></td></tr>`),'Environment routing')}`;
else if(page=='cases')v.innerHTML=`<h2>Notification cases</h2><div class="mut">Repeated events become one actionable case with acknowledgement and resolution.</div>${caseTable(db.cases,'Cases')}`;
else if(page=='policies')v.innerHTML=`<div class="row between"><div><h2>Notification policies</h2><div class="mut">Route events by scope, responsibility role, channel and escalation.</div></div><button class="btn p" onclick="openPolicy()">+ Policy</button></div>${table(['Name','Event','Scope','Channels','Ack',''],db.policies.map(x=>`<tr><td><b>${x.name}</b><div class="mut">${x.escalation}</div></td><td>${x.event}</td><td>${x.scope}</td><td>${x.channels}</td><td>${x.ack}</td><td><button class="btn" onclick="openPolicy(${x.id})">Edit</button></td></tr>`),'Effective policies')}`;
else if(page=='directory')v.innerHTML=`<div class="row between"><div><h2>Directory & ownership</h2><div class="mut">Groups are centrally managed and reused across certificates, apps and environments.</div></div><button class="btn p" onclick="openGroup()">+ Group</button></div>${table(['Group','Delivery alias','Members','Role',''],db.groups.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.email}</td><td>${x.members}</td><td>${x.roles}</td><td><button class="btn" onclick="openGroup(${x.id})">Edit</button></td></tr>`),'Groups')}`;
else if(page=='audit')v.innerHTML=`<h2>Audit trail</h2><div class="mut">Recent changes to ownership, policies, cases and lifecycle operations.</div><div class="list">${db.audit.map(x=>`<div class="listitem"><div><h4>${x.action}</h4><div class="mut">${x.object} · ${x.actor}</div></div><div class="mut">${x.when}</div></div>`).join('')}</div>`;
else if(page=='settings')v.innerHTML=`<h2>Settings</h2><div class="mut">Workspace-level notification defaults.</div><div class="panel" style="padding:16px"><div class="field"><label>Workspace</label><input value="TennCare Enterprise PKI"></div><div class="field"><label>Default timezone</label><select><option>America/Chicago</option><option>America/New_York</option></select></div><div class="field"><label>Critical events</label><select><option>Bypass quiet hours</option><option>Respect quiet hours</option></select></div><button class="btn p" onclick="alert('Demo settings saved')">Save settings</button></div>`;
else v.innerHTML=simulator()}
function certTable(rows,title){return table(['Certificate','Application','Environment','Owner','Expires','Status',''],rows.map(x=>`<tr><td><b>${x.name}</b><div class="mut">Renewal: ${x.renew}</div></td><td>${x.app}</td><td>${x.env}</td><td>${x.owner}</td><td>${x.expires}</td><td>${b(x.status)}</td><td><button class="btn" onclick="openCert(${x.id})">Edit</button></td></tr>`),title)}function caseTable(rows,title){return table(['Event','Certificate','Environment','Assigned group','State',''],rows.map(x=>{let c=db.certs.find(y=>y.id==x.cert);return `<tr><td><b>${x.event}</b><div class="mut">${x.why}</div></td><td>${c?.name||'—'}</td><td>${x.env}</td><td>${x.owner}</td><td>${b(x.state)}</td><td>${x.state!='Resolved'?`<button class="btn" onclick="resolveCase(${x.id})">Resolve</button>`:''}</td></tr>`}),title)}
function drawer(html){document.getElementById('drawer').innerHTML=`<div class="drawer">${html}</div>`}function closeD(){document.getElementById('drawer').innerHTML=''}
function openCert(id){let x=db.certs.find(y=>y.id==id)||{id:Date.now(),name:'',app:'',env:'DEV',owner:db.groups[0]?.name||'',expires:'2026-12-01',status:'Healthy',renew:'Auto'};drawer(`<div class="row between"><h2>${id?'Edit':'Add'} certificate</h2><button class="btn" onclick="closeD()">Close</button></div><form onsubmit="saveCert(event,${x.id},${!!id})"><div class="field"><label>Certificate / common name</label><input name="name" required value="${x.name}"></div><div class="grid2"><div class="field"><label>Application</label><input name="app" value="${x.app}"></div><div class="field"><label>Environment</label><select name="env">${['DEV','SIT','PREPROD','PROD'].map(v=>`<option ${v==x.env?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Owner group</label><select name="owner">${db.groups.map(g=>`<option ${g.name==x.owner?'selected':''}>${g.name}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Expiry</label><input type="date" name="expires" value="${x.expires}"></div><div class="field"><label>Status</label><select name="status">${['Healthy','Warning','Critical'].map(v=>`<option ${v==x.status?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>Renewal mode</label><select name="renew"><option ${x.renew=='Auto'?'selected':''}>Auto</option><option ${x.renew=='Manual'?'selected':''}>Manual</option></select></div><div class="row"><button class="btn p">Save</button>${id?`<button type="button" class="btn d" onclick="deleteCert(${x.id})">Delete</button>`:''}</div></form>`)}function saveCert(e,id,exists){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id;if(exists)db.certs=db.certs.map(x=>x.id==id?o:x);else db.certs.unshift(o);save();closeD();render()}function deleteCert(id){db.certs=db.certs.filter(x=>x.id!=id);db.cases=db.cases.filter(x=>x.cert!=id);save();closeD();render()}function resolveCase(id){let x=db.cases.find(y=>y.id==id);x.state='Resolved';save();render()}
function openPolicy(id){let x=db.policies.find(y=>y.id==id)||{id:Date.now(),name:'',event:'deployment.failed',scope:'All',channels:'Email, In-app',ack:'Yes',escalation:'15m → PKI On-Call'};drawer(`<div class="row between"><h2>${id?'Edit':'Add'} policy</h2><button class="btn" onclick="closeD()">Close</button></div><form onsubmit="savePolicy(event,${x.id},${!!id})">${[['name','Policy name',x.name],['event','Event pattern',x.event],['scope','Scope',x.scope],['channels','Channels',x.channels],['escalation','Escalation',x.escalation]].map(f=>`<div class="field"><label>${f[1]}</label><input name="${f[0]}" value="${f[2]}"></div>`).join('')}<div class="field"><label>Acknowledgement required</label><select name="ack"><option ${x.ack=='Yes'?'selected':''}>Yes</option><option ${x.ack=='No'?'selected':''}>No</option></select></div><button class="btn p">Save policy</button></form>`)}function savePolicy(e,id,exists){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id;if(exists)db.policies=db.policies.map(x=>x.id==id?o:x);else db.policies.unshift(o);save();closeD();render()}
function openGroup(id){let x=db.groups.find(y=>y.id==id)||{id:Date.now(),name:'',email:'',members:1,roles:'Certificate owner'};drawer(`<div class="row between"><h2>${id?'Edit':'Add'} group</h2><button class="btn" onclick="closeD()">Close</button></div><form onsubmit="saveGroup(event,${x.id},${!!id})"><div class="field"><label>Group name</label><input name="name" value="${x.name}" required></div><div class="field"><label>Email / distribution alias</label><input name="email" type="email" value="${x.email}" required></div><div class="field"><label>Members</label><input name="members" type="number" value="${x.members}"></div><div class="field"><label>Responsibility role</label><input name="roles" value="${x.roles}"></div><button class="btn p">Save group</button></form>`)}function saveGroup(e,id,exists){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id;if(exists)db.groups=db.groups.map(x=>x.id==id?o:x);else db.groups.unshift(o);save();closeD();render()}
function editSimple(kind,id){let arr=kind=='app'?db.apps:db.envs,x=arr.find(y=>y.id==id);let fields=kind=='app'?[['name','Application',x.name],['tier','Tier',x.tier],['owner','Owner group',x.owner],['certs','Certificate count',x.certs]]:[['name','Environment',x.name],['operators','Operators',x.operators],['approvers','Approvers',x.approvers],['window','Change window',x.window]];drawer(`<div class="row between"><h2>Edit ${kind=='app'?'application':'environment'}</h2><button class="btn" onclick="closeD()">Close</button></div><form onsubmit="saveSimple(event,'${kind}',${id})">${fields.map(f=>`<div class="field"><label>${f[1]}</label><input name="${f[0]}" value="${f[2]}"></div>`).join('')}<button class="btn p">Save</button></form>`)}function saveSimple(e,kind,id){e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),arr=kind=='app'?db.apps:db.envs;arr.forEach((x,i)=>{if(x.id==id)arr[i]={...x,...o,id}});save();closeD();render()}
function simulator(){return `<div><h2>Recipient simulator</h2><div class="mut">Preview who would receive an event and why, without sending anything.</div></div><div class="panel" style="padding:18px"><div class="grid2"><div class="field"><label>Event</label><select id="se"><option>deployment.failed</option><option>renewal.action_required</option><option>certificate.expiry_risk</option><option>certificate.revoked</option></select></div><div class="field"><label>Certificate</label><select id="sc">${db.certs.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></div></div><button class="btn p" onclick="runSim()">Resolve recipients</button><div id="simout"></div></div>`}function runSim(){let c=db.certs.find(x=>x.id==document.getElementById('sc').value),event=document.getElementById('se').value,names=[c.owner];if(c.env=='PROD')names.push('Production SRE');if(event=='certificate.revoked')names.push('Enterprise PKI On-Call');let groups=[...new Set(names)].map(n=>db.groups.find(g=>g.name==n)).filter(Boolean);simout.innerHTML=table(['Group','Alias','Members','Why'],groups.map(g=>`<tr><td><b>${g.name}</b></td><td>${g.email}</td><td>${g.members}</td><td>${g.name==c.owner?'Certificate owner':'Environment / fallback role'}</td></tr>`),`Resolved audience · ${groups.reduce((a,g)=>a+Number(g.members),0)} users`)}function resetDemo(){db=structuredClone(seed);save();render()}render();
</script>
</body></html>
